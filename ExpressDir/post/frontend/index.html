<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>get & post request</title>
</head>
<body>
    <h1> handle get and post request here</h1>
    <form method="get" action="http://localhost:8080/ragister">
        <input type="text" placeholder="enter your name" name="user">
        <input type="password" placeholder="password" name="password">
       <button>Submit</button>
    </form>
    <br><br><br>
    <form method="post" action="http://localhost:8080/ragister">
        <input type="text" placeholder="enter your name" name="user">
        <input type="password" placeholder="password" name="password">
        <button>Submit</button>
    </form>
</body>
</html>
