<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get & Post</title>
</head>
<body>
    <h2>Standard get Reasponse</h2>
    <form method="get" action="http://localhost:8080/ragister">
        <input type="text" placeholder="enter name" name="name">
        <input type="password" placeholder="password" name="password">
        <button>submit</button>
    </form>
    <br><br><br>
    <h2>Standard post Reasponse</h2>
    <form method="post" action="http://localhost:8080/ragister">
        <input type="text" placeholder="enter name" name="name">
        <input type="password" placeholder="password" name="password">
        <button>submit</button>
    </form>
</body>
</html>
